<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Image Gallery</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQS-fV1cZ50CJW5ErzAassjhOv_ra8Gxm5h9XQjwAtaZg&s"
            alt="CodeAlpha Logo"
            class="logo-img"
          />
        </div>

        <nav class="filter-buttons">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="nature">Nature</button>
          <button class="filter-btn" data-category="art">Art</button>
          <button class="filter-btn" data-category="tech">Tech</button>
        </nav>

        <div class="upload-section">
          <label for="image-upload" class="upload-btn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span>Upload</span>
          </label>
          <input
            type="file"
            id="image-upload"
            accept="image/*"
            multiple
            style="display: none"
          />
        </div>
      </div>
    </header>

    <main class="gallery-container">
      <div class="gallery-item" data-category="nature">
        <img
          src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
          alt="Mountain Landscape"
        />
      </div>
      <div class="gallery-item" data-category="nature">
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/055/352/823/small/lake-and-mountain-nature-beautiful-photo.jpg"
          alt="Mountain Landscape"
        />
      </div>
      <div class="gallery-item" data-category="art">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvfiPCUbk810H4TUcTYqATiL_YQ4HNHXeFqPkUU4ZIfw&s=10"
          alt="City Skyline"
        />
      </div>
      <div class="gallery-item" data-category="art">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxw6jVRkMy_8hiZb4B7YkLVqWVmWGRby0yJFLW6HfZ1rZ-UIOaxacFiv3r&s=10"
          alt="City Skyline"
        />
      </div>
      <div class="gallery-item" data-category="tech">
        <img
          src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80"
          alt="Circuit Board"
        />
      </div>
      <div class="gallery-item" data-category="tech">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcQn_5TA4ilzgPT40qvdrNIg5nAv2CQUFu5X574dsqTrIPawHXvrpDk9QR&s=10"
          alt="Circuit Board"
        />
      </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
      <span class="close-btn">&times;</span>
      <button class="nav-btn prev-btn">&#10094;</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged view" />
      <button class="nav-btn next-btn">&#10095;</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
